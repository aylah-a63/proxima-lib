[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proxima-lib"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.3.0",
    "ollama>=0.3.0",
    "tomli-w>=1.0.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
proxima-lib = "proxima_lib.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["proxima_lib"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
